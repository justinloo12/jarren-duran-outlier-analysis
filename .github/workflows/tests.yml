name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pyflakes
      - name: Lint (pyflakes)
        run: python3 -m pyflakes src/*.py deck/*.py tests/*.py run_all.py build_report.py
      - name: Run unit tests (offline)
        run: python3 -m unittest discover tests -v
