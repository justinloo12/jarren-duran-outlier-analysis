name: Rebuild web page

# Regenerates outputs/duran_case.html whenever the web build script or its
# embedded figures change — so text edits made directly on github.com
# publish to the live GitHub Pages URL automatically.
on:
  push:
    branches: [main]
    paths:
      - "src/web_deck.py"
      - "figures/**"
      - "src/config.py"

concurrency:
  group: rebuild-web
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python3 -m src.web_deck
      - name: Commit rebuilt page if changed
        run: |
          if ! git diff --quiet outputs/duran_case.html; then
            git config user.name "web-rebuild-bot"
            git config user.email "actions@github.com"
            git add outputs/duran_case.html
            git commit -m "Rebuild duran_case.html from web build script"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to the web page."
          fi
