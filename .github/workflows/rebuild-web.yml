name: Rebuild web pages

# Regenerates the GitHub Pages site (index.html, deadline.html,
# outputs/duran_case.html) whenever the build scripts, the article, or the
# embedded figures change — so edits publish to the live URL automatically.
on:
  push:
    branches: [main]
    paths:
      - "src/web_deck.py"
      - "src/web_article.py"
      - "outputs/ARTICLE.md"
      - "data/deadline.json"
      - "figures/**"
      - "src/config.py"

concurrency:
  group: rebuild-web
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python3 -m src.web_deck
      - run: python3 -m src.web_article
      - name: Commit rebuilt pages if changed
        run: |
          if ! git diff --quiet outputs/duran_case.html index.html deadline.html; then
            git config user.name "web-rebuild-bot"
            git config user.email "actions@github.com"
            git add outputs/duran_case.html index.html deadline.html
            git commit -m "Rebuild site pages from web build scripts"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to the web pages."
          fi
